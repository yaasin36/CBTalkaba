<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>CBT SMAI Al Azhar 15 Semarang</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body class="text-slate-800 antialiased h-screen overflow-hidden flex flex-col">

    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] hidden flex flex-col items-center justify-center text-white transition-opacity">
        <i class="fas fa-circle-notch fa-spin text-5xl mb-4 text-indigo-400"></i>
        <p class="font-bold text-lg animate-pulse tracking-wide" id="loading-text">Memproses Data...</p>
    </div>

    <div id="app" class="w-full h-full flex flex-col relative"></div>

    <!-- Alert Modal -->
    <div id="custom-alert" class="fixed inset-0 bg-slate-900/50 z-[999] hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-sm transform scale-95 transition-transform duration-200 text-center border border-slate-100">
            <div id="alert-icon" class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-5 rotate-3"></div>
            <h3 id="alert-title" class="text-xl font-extrabold mb-2 text-slate-800"></h3>
            <p id="alert-message" class="text-slate-500 mb-6 text-sm font-medium leading-relaxed"></p>
            <button onclick="closeCustomAlert()" class="w-full py-3.5 rounded-2xl text-white font-bold transition-all shadow-md hover:shadow-lg active:scale-95 text-sm" id="alert-btn"></button>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="custom-confirm" class="fixed inset-0 bg-slate-900/50 z-[999] hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-sm text-center border border-slate-100">
            <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-600 mx-auto flex items-center justify-center mb-5 shadow-inner rotate-3"><i class="fas fa-question text-3xl"></i></div>
            <h3 id="confirm-title" class="text-xl font-extrabold mb-2 text-slate-800">Konfirmasi</h3>
            <p id="confirm-message" class="text-slate-500 mb-6 text-sm font-medium leading-relaxed"></p>
            <div class="flex gap-3">
                <button onclick="executeConfirm(false)" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-2xl transition-colors text-sm">Batal</button>
                <button onclick="executeConfirm(true)" class="flex-1 text-white font-bold py-3.5 rounded-2xl transition-all shadow-md active:scale-95 text-sm" id="confirm-btn-yes">Ya</button>
            </div>
        </div>
    </div>

    <!-- Modal Token -->
    <div id="token-modal" class="fixed inset-0 bg-slate-900/70 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-sm text-center">
            <div class="w-16 h-16 rounded-2xl bg-indigo-100 text-indigo-600 mx-auto flex items-center justify-center mb-5 shadow-inner rotate-3"><i class="fas fa-key text-3xl"></i></div>
            <h3 class="text-xl font-extrabold mb-2 text-slate-800">Masukkan Token Ujian</h3>
            <p id="token-desc" class="text-slate-500 mb-5 text-sm font-medium">Ujian ini memerlukan token dari pengawas.</p>
            <input type="text" id="input-token" class="w-full text-center px-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl outline-none focus:border-indigo-500 font-black text-xl uppercase tracking-widest mb-5 transition-colors" placeholder="XXXXXX">
            <input type="hidden" id="token-exam-id">
            <input type="hidden" id="token-type">
            <div class="flex gap-3">
                <button onclick="closeTokenModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-2xl text-sm transition-colors">Batal</button>
                <button onclick="submitToken()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-md text-sm transition-transform active:scale-95">Validasi</button>
            </div>
        </div>
    </div>

    <!-- Modal Ganti Password -->
    <div id="password-modal" class="fixed inset-0 bg-slate-900/70 z-[150] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden">
            <div class="p-5 bg-slate-50 border-b flex justify-between items-center">
                <h3 class="font-extrabold text-slate-800"><i class="fas fa-lock text-indigo-500 mr-2"></i> Ganti Kata Sandi</h3>
                <button onclick="closePasswordModal()"><i class="fas fa-times text-slate-400 hover:text-red-500 text-lg transition-colors"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Password Lama</label>
                    <input type="password" id="old-pass" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium transition-shadow">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Password Baru</label>
                    <input type="password" id="new-pass" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium transition-shadow">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Konfirmasi Password Baru</label>
                    <input type="password" id="confirm-pass" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium transition-shadow">
                </div>
            </div>
            <div class="p-5 bg-slate-50 border-t flex gap-3">
                <button onclick="closePasswordModal()" class="flex-1 bg-white border border-slate-200 text-slate-700 font-bold py-3 rounded-xl hover:bg-slate-100 transition-colors text-sm">Batal</button>
                <button onclick="submitChangePassword()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition-transform active:scale-95 text-sm">Simpan Baru</button>
            </div>
        </div>
    </div>

    <!-- Modal Tambah/Edit User -->
    <div id="user-modal" class="fixed inset-0 bg-slate-900/70 z-[150] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="p-5 bg-slate-50 border-b flex justify-between items-center">
                <h3 class="font-extrabold text-slate-800" id="user-modal-title"><i class="fas fa-user-plus text-indigo-500 mr-2"></i> Form Anggota</h3>
                <button onclick="closeUserModal()"><i class="fas fa-times text-slate-400 hover:text-red-500 text-lg transition-colors"></i></button>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="user-is-new" value="true">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Username</label>
                    <input type="text" id="user-username" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Nama Lengkap</label>
                    <input type="text" id="user-name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Password Default</label>
                    <input type="text" id="user-password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Hak Akses (Role)</label>
                    <select id="user-role" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium cursor-pointer" onchange="toggleUserFields()">
                        <option value="user">Siswa (User)</option>
                        <option value="admin">Guru (Admin)</option>
                        <option value="superadmin">Panitia (Superadmin)</option>
                    </select>
                </div>
                <div id="user-class-container">
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Kelas <span class="text-rose-500">*</span></label>
                    <input type="text" id="user-class" placeholder="Contoh: XI - MIPA 1" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                </div>
                <div id="user-mapel-container" class="hidden">
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Mata Pelajaran <span class="text-rose-500">*</span></label>
                    <input type="text" id="user-mapel" placeholder="Contoh: Matematika" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                </div>
            </div>
            <div class="p-5 bg-slate-50 border-t flex gap-3">
                <button onclick="closeUserModal()" class="flex-1 bg-white border border-slate-200 text-slate-700 font-bold py-3 rounded-xl hover:bg-slate-100 transition-colors text-sm shadow-sm">Batal</button>
                <button onclick="saveUser()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition-transform active:scale-95 text-sm">Simpan Profil</button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // DECOUPLED ARCHITECTURE CONFIGURATION (Untuk GitHub Pages)
        // Ganti URL di bawah ini dengan URL Web App Google Apps Script Anda (doPost)
        // =========================================================================
        const API_URL = "https://script.google.com/macros/s/AKfycby4cVFnILF_1lCUa4jYuOPhUm35viASpTfao6Jph7dKManqVIpUSvDHZChq4V9dJ-Pb7Q/exec";

        // Fungsi Core untuk Komunikasi HTTP ke Google Apps Script (Fetch API)
        async function callServer(action, payload = {}) {
            const loader = document.getElementById('loading-overlay');
            const loaderText = document.getElementById('loading-text');
            
            if(loader && !['apiSaveQuestions', 'apiSubmitExam', 'apiUpdateSession', 'apiSaveEssayScore', 'apiGetTokenCandidates'].includes(action)) {
                if(loaderText) loaderText.innerText = 'Memproses Data...';
                loader.classList.remove('hidden');
            }

            // Simulasi jika URL API belum diisi (Agar UI tetap bisa di-test)
            if (API_URL === "MASUKKAN_URL_WEB_APP_ANDA_DISINI" || !API_URL) {
                console.warn("WARNING: URL API belum dikonfigurasi! Harap ganti variabel API_URL.");
                if(loader) loader.classList.add('hidden');
                throw new Error("Sistem belum terhubung ke Database Server (URL API Kosong).");
            }

            try {
                // Konfigurasi fetch POST untuk menghubungi doGet/doPost Google Script
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: action, data: payload })
                });

                if (!response.ok) throw new Error("Gagal menghubungi server (Network Error).");

                const result = await response.json();
                
                if (loader) loader.classList.add('hidden');

                if (result.status === "error") {
                    showCustomAlert('Error Server', result.message || 'Terjadi kesalahan sistem di server.', 'error');
                    throw new Error(result.message);
                }
                
                return result.data;
            } catch (error) {
                if (loader) loader.classList.add('hidden');
                console.error("API Call Error:", error);
                
                if (action !== 'apiUpdateSession') {
                     showCustomAlert('Koneksi Gagal', error.message || 'Periksa koneksi internet Anda atau hubungi admin.', 'error');
                }
                throw error;
            }
        }


        // ==========================================
        // FUNGSI UTAMA FRONTEND (LOGIKA UI)
        // ==========================================
        function escapeHTML(str) {
            if(typeof str !== 'string') return str;
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        let currentUser = null;
        let currentView = 'login'; 
        let examsList = []; 
        let activeExamSessionId = null; 
        let manageExamId = null; 
        let activeQuestions = []; 
        let analyticsData = {};
        let detailedAnalyticsData = null;
        
        let adminTokenData = { candidates: [], tokens: [] };
        let activeTokenExamId = null; 
        let activeTokenClass = null;
        let tokenViewMode = 'grid';
        let activeTokenTab = 'susulan'; 
        function switchTokenTab(tab) { activeTokenTab = tab; refreshAdminTokenData(); } 

        let selectedDetailClass = 'all'; 
        let usersList = []; 

        let activeUserRoleFilter = 'all';
        let activeUserClassFilter = 'all';
        let activeAnalyticsClassFilter = 'all';
        let activeAnalyticsExamFilter = 'all';

        let examTimeLeft = 0; let examInterval = null;
        let currentQuestionIndex = 0; let studentAnswers = {}; 
        let cheatWarnings = 0; let isExamLocked = false; let lastCheatTime = 0; 
        let hasUsedUnlockToken = false;
        
        let classOptions = []; 
        let tempPrompts = []; let tempOptions = []; let tempAnswerKey = null;
        let tempQImage = ''; 
        let tempOptsImage = ['', '', '', '', ''];
        let lastEditedQType = null;
        
        let isUnloading = false;
        window.addEventListener('beforeunload', () => { isUnloading = true; });

        function showCustomAlert(title, message, type = 'info', btnText = 'Tutup') {
            document.getElementById('alert-title').innerText = title; document.getElementById('alert-message').innerHTML = message; document.getElementById('alert-btn').innerText = btnText;
            const iconWrap = document.getElementById('alert-icon'); const btn = document.getElementById('alert-btn');
            iconWrap.className = 'w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-5 rotate-3 shadow-inner';
            btn.className = 'w-full py-3.5 rounded-2xl text-white font-bold transition-all shadow-md active:scale-95 text-sm outline-none focus:ring-4';
            if (type === 'success') { iconWrap.classList.add('bg-emerald-100', 'text-emerald-600'); iconWrap.innerHTML = '<i class="fas fa-check text-3xl"></i>'; btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'focus:ring-emerald-200'); } 
            else if (type === 'error') { iconWrap.classList.add('bg-rose-100', 'text-rose-600'); iconWrap.innerHTML = '<i class="fas fa-exclamation-triangle text-3xl"></i>'; btn.classList.add('bg-rose-600', 'hover:bg-rose-700', 'focus:ring-rose-200'); } 
            else { iconWrap.classList.add('bg-indigo-100', 'text-indigo-600'); iconWrap.innerHTML = '<i class="fas fa-info-circle text-3xl"></i>'; btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'focus:ring-indigo-200'); }
            document.getElementById('custom-alert').classList.remove('hidden');
        }
        function closeCustomAlert() { document.getElementById('custom-alert').classList.add('hidden'); }
        
        let confirmAction = null;
        function showCustomConfirm(title, message, btnText, type, callback) {
            document.getElementById('confirm-title').innerText = title; document.getElementById('confirm-message').innerHTML = message;
            const btnYes = document.getElementById('confirm-btn-yes'); btnYes.innerText = btnText;
            btnYes.className = `flex-1 text-white font-bold py-3.5 rounded-2xl transition-all shadow-md active:scale-95 text-sm ${type==='danger'?'bg-rose-600 hover:bg-rose-700':'bg-indigo-600 hover:bg-indigo-700'}`;
            confirmAction = callback; document.getElementById('custom-confirm').classList.remove('hidden');
        }
        function executeConfirm(result) { document.getElementById('custom-confirm').classList.add('hidden'); if (result && confirmAction) confirmAction(); confirmAction = null; }
        function toggleSidebar() { const s = document.getElementById('main-sidebar'); const b = document.getElementById('sidebar-backdrop'); if(s) { s.classList.toggle('-translate-x-full'); b.classList.toggle('hidden'); } }

        function openPasswordModal() { 
            document.getElementById('old-pass').value = ''; document.getElementById('new-pass').value = ''; document.getElementById('confirm-pass').value = ''; 
            document.getElementById('password-modal').classList.remove('hidden'); 
        }
        function closePasswordModal() { document.getElementById('password-modal').classList.add('hidden'); }
        
        async function submitChangePassword() {
            const oldP = document.getElementById('old-pass').value; const newP = document.getElementById('new-pass').value; const confP = document.getElementById('confirm-pass').value;
            if(!oldP || !newP || !confP) return showCustomAlert('Peringatan', 'Semua kolom wajib diisi.', 'error');
            if(newP !== confP) return showCustomAlert('Peringatan', 'Konfirmasi password tidak cocok.', 'error');
            
            try {
                const res = await callServer('apiChangePassword', { username: currentUser.username, oldPassword: oldP, newPassword: newP });
                if(res.success) { 
                    closePasswordModal(); showCustomAlert('Berhasil', 'Kata sandi berhasil diubah.', 'success'); 
                    currentUser.password = newP; 
                    let userToSave = {...currentUser}; delete userToSave.password; 
                    localStorage.setItem('cbt_user', JSON.stringify(userToSave)); 
                } else showCustomAlert('Gagal', res.message, 'error');
            } catch(e) {}
        }

        async function login() {
            const u = document.getElementById('login-username').value; const p = document.getElementById('login-password').value;
            if(!u || !p) { showCustomAlert('Peringatan', 'Isi Username & Password.', 'error'); return; }
            
            try {
                const user = await callServer('apiLogin', {username: u || '', password: p || ''});
                if(user) {
                    currentUser = {...user}; 
                    let userToSave = {...user}; delete userToSave.password;
                    localStorage.setItem('cbt_user', JSON.stringify(userToSave));
                    if(currentUser.role === 'admin' || currentUser.role === 'superadmin') { classOptions = await callServer('apiGetClasses', {}); }
                    navigateTo((currentUser.role === 'admin' || currentUser.role === 'superadmin') ? 'admin-dashboard' : 'user-dashboard');
                } else showCustomAlert('Login Gagal', 'Username atau password tidak valid.', 'error');
            } catch (e) {}
        }

        function logout() {
            exitFullscreen(); document.removeEventListener('keydown', disableCopyKeys);
            currentUser = null; localStorage.removeItem('cbt_user'); localStorage.removeItem('cbt_route');
            navigateTo('login');
            setTimeout(() => { showCustomAlert('Berhasil Keluar', 'Anda telah berhasil logout dari sistem.', 'success'); }, 300);
        }

        async function navigateTo(view, dataId = null) {
            if(view !== 'login') localStorage.setItem('cbt_route', JSON.stringify({ view: view, dataId: dataId }));
            try {
                if (view === 'user-dashboard') examsList = await callServer('apiGetExams', { role: 'user', filterValue: currentUser.class || '', username: currentUser.username });
                else if (view === 'user-exam-prep' && dataId) { 
                    activeExamSessionId = dataId; 
                    if(examsList.length === 0) examsList = await callServer('apiGetExams', { role: 'user', filterValue: currentUser.class || '', username: currentUser.username });
                    activeQuestions = await callServer('apiGetQuestionsForExam', { examId: dataId || '' }); 
                }
                else if (view === 'exam-active' && dataId) { 
                    activeExamSessionId = dataId; 
                    if(examsList.length === 0) examsList = await callServer('apiGetExams', { role: 'user', filterValue: currentUser.class || '', username: currentUser.username });
                    activeQuestions = await callServer('apiGetQuestionsForExam', { examId: dataId || '' }); 
                }
                else if (view === 'admin-dashboard') { 
                    examsList = await callServer('apiGetExams', { role: currentUser.role, filterValue: currentUser.mapel || '' }); 
                    analyticsData = await callServer('apiGetAnalytics', { role: currentUser.role, mapel: currentUser.mapel || '', examId: 'all', className: 'all' }); 
                }
                else if (view === 'admin-analytics') { 
                    activeAnalyticsClassFilter = 'all';
                    activeAnalyticsExamFilter = 'all';
                    examsList = await callServer('apiGetExams', { role: currentUser.role, filterValue: currentUser.mapel || '' }); 
                    analyticsData = await callServer('apiGetAnalytics', { role: currentUser.role, mapel: currentUser.mapel || '', examId: 'all', className: 'all' }); 
                }
                else if (view === 'admin-detailed-analytics') { 
                    if(!selectedDetailClass || view !== currentView) { selectedDetailClass = 'all'; }
                    detailedAnalyticsData = await callServer('apiGetDetailedAnalytics', { examId: dataId }); 
                }
                else if (view === 'admin-manage-exams') {
                    if(dataId === 'reset' || !dataId) { manageExamId = null; examsList = await callServer('apiGetExams', { role: currentUser.role, filterValue: currentUser.mapel || '' }); } 
                    else if(dataId) { manageExamId = dataId; activeQuestions = await callServer('apiGetQuestions', { examId: dataId || '' }); }
                }
                else if (view === 'admin-tokens') {
                    if (currentUser.role !== 'superadmin') {
                        showCustomAlert('Akses Ditolak', 'Hanya Panitia (Superadmin) yang memiliki akses ke Manajemen Token.', 'error');
                        return;
                    }
                    adminTokenData = { candidates: [], tokens: [] }; activeTokenClass = null; activeTokenExamId = null;
                    examsList = await callServer('apiGetExams', { role: currentUser.role, filterValue: currentUser.mapel || '' }); 
                    classOptions = await callServer('apiGetClasses', {});
                }
                else if (view === 'superadmin-users') {
                    activeUserRoleFilter = 'all'; activeUserClassFilter = 'all';
                    usersList = await callServer('apiGetAllUsers', {});
                }
                else if (view === 'superadmin-data') {
                    examsList = await callServer('apiGetExams', { role: 'superadmin', filterValue: '' }); 
                }
            } catch(e) {
                console.error('navigateTo gagal mengambil data:', view, e);
                localStorage.removeItem('cbt_route'); 
                currentView = currentUser && (currentUser.role === 'admin' || currentUser.role === 'superadmin') ? 'admin-dashboard' : 'user-dashboard';
                renderApp();
                return;
            }

            currentView = view;
            const sidebar = document.getElementById('main-sidebar');
            if(sidebar && !sidebar.classList.contains('-translate-x-full') && window.innerWidth < 1024) toggleSidebar();
            renderApp();
        }

            if (role === 'user') { classContainer.classList.remove('hidden'); mapelContainer.classList.add('hidden'); }

            const isNew = !user;
            document.getElementById('user-is-new').value = isNew;
            document.getElementById('user-modal-title').innerHTML = isNew ? '<i class="fas fa-user-plus text-indigo-500 mr-2"></i> Tambah Anggota' : '<i class="fas fa-user-edit text-indigo-500 mr-2"></i> Edit Anggota';
            document.getElementById('user-username').value = user ? user.username : '';
            document.getElementById('user-username').disabled = !isNew; 
            document.getElementById('user-name').value = user ? user.name : '';
            document.getElementById('user-password').value = user ? user.password : '';
            document.getElementById('user-role').value = user ? user.role : 'user';
            document.getElementById('user-class').value = user ? (user.class || '') : '';
            document.getElementById('user-mapel').value = user ? (user.mapel || '') : '';

        async function saveUser() {
            const isNew = document.getElementById('user-is-new').value === 'true';
            const payload = {
                isNew: isNew,
                username: document.getElementById('user-username').value.trim(),
                name: document.getElementById('user-name').value.trim(),
                password: document.getElementById('user-password').value.trim(),
                role: document.getElementById('user-role').value,
                class: document.getElementById('user-class').value.trim(),
                mapel: document.getElementById('user-mapel').value.trim()
            };
            if(!payload.username || !payload.name || !payload.password) return showCustomAlert('Peringatan', 'Username, Nama, dan Password wajib diisi!', 'error');
            
            try {
                const res = await callServer('apiSaveUser', payload);
                if(res.success) { closeUserModal(); showCustomAlert('Berhasil', 'Data pengguna berhasil disimpan.', 'success'); usersList = await callServer('apiGetAllUsers', {}); renderApp(); } 
                else { showCustomAlert('Gagal', res.message, 'error'); }
            } catch(e){}
        }

                    const res = await callServer('apiDeleteUser', { username: username });
                    if(res.success) { showCustomAlert('Berhasil', 'Pengguna berhasil dihapus.', 'success'); usersList = await callServer('apiGetAllUsers', {}); renderApp(); }

            });

        function openExamMetaModal(examId = null) {
            document.getElementById('edit-exam-id').value = examId || '';
            const container = document.getElementById('edit-exam-classes-container');
            const titleEl = document.getElementById('exam-meta-modal-title');
            
            if(examId) {
                const ex = examsList.find(e => e.id === examId);
                if(!ex) return;
                titleEl.innerHTML = '<i class="fas fa-edit text-indigo-500 mr-2"></i> Edit Info Ujian';
                document.getElementById('edit-exam-title').value = ex.title;
                document.getElementById('edit-exam-mapel').value = ex.mapel || currentUser.mapel;
                document.getElementById('edit-exam-duration').value = ex.duration;
                document.getElementById('edit-exam-start').value = (ex.startTime && typeof ex.startTime === 'string') ? ex.startTime.slice(0, 16) : '';
                document.getElementById('edit-exam-end').value = (ex.endTime && typeof ex.endTime === 'string') ? ex.endTime.slice(0, 16) : '';
                container.innerHTML = classOptions.map(cls => `<label class="flex items-center gap-2.5 cursor-pointer bg-white p-2 rounded-xl border border-slate-200"><input type="checkbox" name="edit_target_class" value="${cls}" class="w-4 h-4 accent-indigo-600" ${ex.targetClasses.includes(cls) ? 'checked' : ''}> <span class="text-xs font-bold text-slate-700">${cls}</span></label>`).join('');
            } else {
                titleEl.innerHTML = '<i class="fas fa-plus-circle text-indigo-500 mr-2"></i> Buat Ujian Baru';
                document.getElementById('edit-exam-title').value = '';
                document.getElementById('edit-exam-mapel').value = currentUser?.role === 'superadmin' ? '' : currentUser.mapel;
                document.getElementById('edit-exam-duration').value = '90';
                document.getElementById('edit-exam-start').value = '';
                document.getElementById('edit-exam-end').value = '';
                container.innerHTML = classOptions.map(cls => `<label class="flex items-center gap-2.5 cursor-pointer bg-white p-2 rounded-xl border border-slate-200"><input type="checkbox" name="edit_target_class" value="${cls}" class="w-4 h-4 accent-indigo-600"> <span class="text-xs font-bold text-slate-700">${cls}</span></label>`).join('');
            }
            document.getElementById('exam-meta-modal').classList.remove('hidden');
        }
        
        function closeExamMetaModal() { document.getElementById('exam-meta-modal').classList.add('hidden'); }

        async function saveExamMetadata() {
            const id = document.getElementById('edit-exam-id').value || ('exam-' + Date.now().toString(36));
            const title = document.getElementById('edit-exam-title').value.trim();
            const mapel = document.getElementById('edit-exam-mapel').value.trim();
            const duration = parseInt(document.getElementById('edit-exam-duration').value) || 90;
            
            let startTimeRaw = document.getElementById('edit-exam-start').value;
            let endTimeRaw = document.getElementById('edit-exam-end').value;
            
            const targetClasses = Array.from(document.querySelectorAll('input[name="edit_target_class"]:checked')).map(cb => cb.value);
            
            if(!title || !mapel || targetClasses.length === 0) { showCustomAlert('Gagal', 'Judul, Mapel, dan minimal 1 Target Kelas wajib diisi.', 'error'); return; }
            
            try {
                await callServer('apiSaveExamMetadata', { id: id, title: title, mapel: mapel, duration: duration, startTime: startTimeRaw, endTime: endTimeRaw, targetClassesJSON: JSON.stringify(targetClasses) });
                closeExamMetaModal();
                showCustomAlert('Berhasil', 'Data Ujian telah berhasil disimpan ke sistem.', 'success');
                examsList = await callServer('apiGetExams', { role: currentUser.role, filterValue: currentUser.mapel || '' });
                renderApp();
            } catch(e) {}
        }

        function deleteExam(examId) {
            showCustomConfirm('Hapus Ujian?', 'Yakin ingin menghapus ujian ini secara permanen beserta data nilainya? Aksi ini tidak dapat dibatalkan.', 'Ya, Hapus', 'danger', async () => {
                try {
                    await callServer('apiDeleteExam', { examId: examId });
                    showCustomAlert('Dihapus', 'Ujian berhasil dihapus dari sistem.', 'success');
                    examsList = await callServer('apiGetExams', { role: currentUser.role, filterValue: currentUser.mapel || '' });
                    renderApp();
                } catch(e) {}
            });
        }

        function addQuestion() {
            let newQ = { type: 'pg', text: '', image: '', options: ['', '', '', '', ''], optionsImg: ['', '', '', '', ''], prompts: [], answerKey: '' };
            activeQuestions.push(newQ); openEditModal(activeQuestions.length - 1);
        }
        
        function deleteQuestion(i) {
            showCustomConfirm('Hapus Soal?', 'Yakin ingin menghapus soal ini secara permanen dari server?', 'Ya, Hapus Soal', 'danger', async () => {
                activeQuestions.splice(i, 1);
                try {
                    await callServer('apiSaveQuestions', { examId: manageExamId, questionsJSON: JSON.stringify(activeQuestions) });
                    renderApp();
                } catch(e) {}
            });
        }

        function getQuestionTypeGroup(type) {
            if(type === 'pg' || type === 'pgk') return 'choice';
            if(type === 'bs') return 'boolean';
            if(type === 'jodoh') return 'matching';
            if(type === 'uraian') return 'essay';
            return 'choice';
        }

        function changeQuestionType() {
            const type = document.getElementById('edit-q-type').value;
            if(getQuestionTypeGroup(type) !== getQuestionTypeGroup(lastEditedQType)) {
                if(type === 'jodoh') { tempPrompts = ["", ""]; tempOptions = ["", ""]; }
                else if(type === 'bs') { tempOptions = ["Benar", "Salah"]; tempPrompts = ["", ""]; }
                else if(type === 'uraian') { tempOptions = []; tempPrompts = []; }
                else { tempOptions = ['', '', '', '', '']; tempPrompts = []; }
            }

            if(type === 'pgk') tempAnswerKey = [];
            else if(type === 'jodoh' || type === 'bs') tempAnswerKey = {};
            else if(type === 'uraian') tempAnswerKey = ''; 
            else tempAnswerKey = null; 

            lastEditedQType = type; renderEditOptions();
        }

        function openEditModal(index) {
            const q = activeQuestions[index];
            document.getElementById('edit-q-index').value = index; document.getElementById('edit-q-num').innerText = index + 1;
            document.getElementById('edit-q-type').value = q.type || 'pg';
            document.getElementById('edit-q-text').value = (q.text || '').replace(/<br>/g, '\n');
            
            tempQImage = q.image || '';
            document.getElementById('q-image-preview').innerHTML = tempQImage ? `<div class="relative inline-block mt-2"><img src="${tempQImage}" class="max-h-40 rounded-lg border border-slate-200 shadow-sm"><button onclick="tempQImage=''; document.getElementById('q-image-preview').innerHTML=''" class="absolute -top-2 -right-2 bg-rose-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-md"><i class="fas fa-times"></i></button></div>` : '';
            
            tempOptions = (q.options || []).length > 0 ? [...q.options] : ['','','','',''];
            tempOptsImage = (q.optionsImg || []).length > 0 ? [...q.optionsImg] : ['','','','',''];
            tempPrompts = (q.prompts || []).length > 0 ? [...q.prompts] : [];
            
            if(q.type === 'pg') tempAnswerKey = tempOptions.indexOf(q.answerKey); 
            else if(q.type === 'bs') {
                tempAnswerKey = {};
                if(q.answerKey) { for(let i=0; i<q.prompts.length; i++) { tempAnswerKey[i] = q.answerKey[i] === 'Benar' ? 0 : (q.answerKey[i] === 'Salah' ? 1 : null); } }
            }
            else if(q.type === 'pgk') tempAnswerKey = (q.answerKey||[]).map(val => tempOptions.indexOf(val)).filter(idx => idx !== -1);
            else if(q.type === 'jodoh') {
                tempAnswerKey = {};
                if(q.answerKey) { for(let pIdx in q.answerKey) tempAnswerKey[pIdx] = tempOptions.indexOf(q.answerKey[pIdx]); }
            } else if(q.type === 'uraian') {
                tempAnswerKey = q.answerKey || '';
            } else tempAnswerKey = null;

            lastEditedQType = q.type || 'pg'; renderEditOptions();
            document.getElementById('edit-question-modal').classList.remove('hidden');
        }

        function togglePgkKey(i) {
            if(!Array.isArray(tempAnswerKey)) tempAnswerKey = [];
            if(tempAnswerKey.includes(i)) tempAnswerKey = tempAnswerKey.filter(x => x !== i);
            else tempAnswerKey.push(i);
            renderEditOptions(); 
        }

                                <button onclick="tempOptions.splice(${i},1); renderEditOptions()" class="text-rose-400 hover:text-rose-600 hover:bg-rose-50 p-2.5 rounded-xl transition-colors"><i class="fas fa-trash"></i></button>
                            </div>`;
                        }
                html += `</div></div></div>`;
            }
            else if (type === 'uraian') {
                tempOptions = []; tempPrompts = [];
                if(!tempAnswerKey || typeof tempAnswerKey !== 'string') tempAnswerKey = '';
                html = `<div class="mb-6"><label class="block text-xs font-extrabold text-indigo-600 mb-3 uppercase tracking-wider"><i class="fas fa-info-circle"></i> Pedoman Penilaian / Kunci Jawaban Utama</label><textarea id="edit-q-uraian-key" oninput="tempAnswerKey=this.value" placeholder="Ketik pedoman/kriteria penilaian (rubrik) untuk memudahkan koreksi nantinya..." class="w-full px-5 py-4 border border-indigo-200 bg-indigo-50/30 rounded-2xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm shadow-sm transition-all font-medium leading-relaxed" rows="5">${escapeHTML(tempAnswerKey)}</textarea></div>`;
            }
            area.innerHTML = html;
        }

        function closeEditModal() { document.getElementById('edit-question-modal').classList.add('hidden'); renderApp(); }

        async function saveEditedQuestion() {
            const index = parseInt(document.getElementById('edit-q-index').value);
            const q = activeQuestions[index]; 
            q.type = document.getElementById('edit-q-type').value;
            q.text = document.getElementById('edit-q-text').value.replace(/\n/g, '<br>');
            q.image = tempQImage;
            
            if(q.type === 'pg') { 
                q.options = [...tempOptions]; 
                q.optionsImg = [...tempOptsImage];
                q.answerKey = tempAnswerKey !== null && tempAnswerKey >= 0 ? tempOptions[tempAnswerKey] : ''; 
            } 
            else if (q.type === 'pgk') { 
                q.options = [...tempOptions]; 
                q.optionsImg = [...tempOptsImage];
                q.answerKey = Array.isArray(tempAnswerKey) ? tempAnswerKey.map(idx => tempOptions[idx]) : []; 
            } 
            else if (q.type === 'bs') { 
                q.options = ["Benar", "Salah"]; 
                q.prompts = tempPrompts.filter(p => p.trim() !== '');
                let keyObj = {};
                for(let pIdx in tempAnswerKey) {
                    if(tempAnswerKey[pIdx] === 0) keyObj[pIdx] = "Benar";
                    else if(tempAnswerKey[pIdx] === 1) keyObj[pIdx] = "Salah";
                }
                q.answerKey = keyObj;
            } 
            else if (q.type === 'jodoh') {
                q.options = tempOptions.filter(o => o.trim() !== ''); q.prompts = tempPrompts.filter(p => p.trim() !== '');
                let keyObj = {};
                for(let pIdx in tempAnswerKey) { let oIdx = tempAnswerKey[pIdx]; if(oIdx !== -1 && tempOptions[oIdx]) keyObj[pIdx] = tempOptions[oIdx]; }
                q.answerKey = keyObj;
            }
            else if (q.type === 'uraian') {
                q.options = []; q.prompts = []; q.answerKey = tempAnswerKey;
            }

            try {
                await callServer('apiSaveQuestions', { examId: manageExamId, questionsJSON: JSON.stringify(activeQuestions) });
                closeEditModal(); showCustomAlert('Soal Disimpan', 'Pembaruan detail soal berhasil dikirim ke Server.', 'success');
            } catch(e) {}
        }

        async function autoUploadImage(fileInput, targetType, optIndex = null) {
            if (!fileInput.files || fileInput.files.length === 0) return;
            const file = fileInput.files[0];
            
            let statusId = targetType === 'Soal' ? 'upload-status-Soal' : 'upload-status-opt-' + optIndex;
            const statusDiv = document.getElementById(statusId);

            if (file.size > 2 * 1024 * 1024) {
                fileInput.value = '';
                return showCustomAlert('Terlalu Besar', 'Ukuran gambar maksimal 2MB.', 'error');
            }

            let mapelName = "Umum"; let examTitle = "Ujian";
            if (typeof manageExamId !== 'undefined' && manageExamId) {
                const currentExam = examsList.find(e => e.id === manageExamId);
                if (currentExam) { mapelName = currentExam.mapel || "Umum"; examTitle = currentExam.title || "Ujian"; }
            }
            let qNumber = parseInt(document.getElementById('edit-q-index').value) + 1;

            statusDiv.classList.remove('hidden');
            statusDiv.className = "mt-2 text-[10px] font-bold text-amber-600 bg-amber-50 p-2 rounded-lg border border-amber-100";
            statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Mengunggah ke Drive...';

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Data = e.target.result.split(',')[1];
                try {
                    const res = await callServer('apiUploadImage', { 
                        filename: file.name, mimeType: file.type, base64: base64Data,
                        mapel: mapelName, examTitle: examTitle, qNumber: qNumber, target: targetType
                    });

                    if (res.success) {
                        statusDiv.className = "mt-2 text-[10px] font-bold text-emerald-600 bg-emerald-50 p-2 rounded-lg border border-emerald-100";
                        statusDiv.innerHTML = `<i class="fas fa-check-circle mr-1"></i> Selesai!`;
                        
                        if (targetType === 'Soal') {
                            tempQImage = res.url;
                            document.getElementById('q-image-preview').innerHTML = `<div class="relative inline-block mt-3"><img src="${res.url}" class="max-h-40 rounded-lg border border-slate-200 shadow-sm"><button onclick="tempQImage=''; document.getElementById('q-image-preview').innerHTML=''" class="absolute -top-2 -right-2 bg-rose-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-md"><i class="fas fa-times"></i></button></div>`;
                        } else {
                            tempOptsImage[optIndex] = res.url;
                            renderEditOptions(); 
                        }
                    } else throw new Error(res.message);
                } catch (error) {
                    statusDiv.className = "mt-2 text-[10px] font-bold text-rose-600 bg-rose-50 p-2 rounded-lg border border-rose-100";
                    statusDiv.innerHTML = `<i class="fas fa-exclamation-triangle mr-1"></i> Gagal: ${error.message}`;
                } finally {
                    fileInput.value = '';
                    setTimeout(() => statusDiv.classList.add('hidden'), 3000);
                }
            };
            reader.readAsDataURL(file);
        }

        function saveExamStateLocal() {
            if (activeExamSessionId && currentView === 'exam-active') {
                localStorage.setItem('cbt_exam_state_' + activeExamSessionId, JSON.stringify({
                    time: examTimeLeft, 
                    answers: studentAnswers[activeExamSessionId], 
                    index: currentQuestionIndex,
                    hasUsedUnlockToken: hasUsedUnlockToken, 
                    cheatWarnings: cheatWarnings,
                    isLocked: isExamLocked
                }));
            }
        }

        function initExam() {
            const exam = examsList.find(e => e.id === activeExamSessionId);
            if(!exam || activeQuestions.length === 0) return;

            cheatWarnings = 0; isExamLocked = false; lastCheatTime = 0; hasUsedUnlockToken = false;
            
            const savedStateStr = localStorage.getItem('cbt_exam_state_' + activeExamSessionId);
            if (savedStateStr) {
                const s = JSON.parse(savedStateStr);
                examTimeLeft = s.time;
                if(!studentAnswers[activeExamSessionId]) studentAnswers[activeExamSessionId] = {};
                studentAnswers[activeExamSessionId] = s.answers || {};
                currentQuestionIndex = s.index || 0;
                hasUsedUnlockToken = s.hasUsedUnlockToken || false;
                cheatWarnings = s.cheatWarnings || 0;
                isExamLocked = s.isLocked || false;
            } else {
                currentQuestionIndex = 0; examTimeLeft = exam.duration * 60;
                studentAnswers[activeExamSessionId] = {};
            }
            
            if(isExamLocked) {
                document.getElementById('exam-locked-screen').classList.remove('hidden'); 
                callServer('apiUpdateSession', { examId: activeExamSessionId, username: currentUser.username, status: 'LOCKED', cheatCount: cheatWarnings }).catch(()=>{});
            } else {
                callServer('apiUpdateSession', { examId: activeExamSessionId, username: currentUser.username, status: 'STARTED' }).catch(()=>{});
            }
            
            setTimeout(() => { requestFullscreen(); }, 100);
            renderQuestionGrid(); renderQuestion(); startTimer();
            
            document.addEventListener('visibilitychange', handleVisibilityChange); window.addEventListener('blur', handleBlur); document.addEventListener('keydown', disableCopyKeys);
        }

        function startTimer() {
            if (examInterval) clearInterval(examInterval);
            examInterval = setInterval(() => {
                if(isExamLocked) return;
                examTimeLeft--;
                let m = Math.floor(examTimeLeft / 60); let s = examTimeLeft % 60;
                document.getElementById('timer-display').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                
                if (examTimeLeft % 5 === 0) saveExamStateLocal(); 
                if(examTimeLeft <= 0) finishExamAuto('Waktu Pengerjaan Habis!');
            }, 1000);
        }

        function renderQuestionGrid() {
            const grid = document.getElementById('question-grid'); if(!grid) return;
            let html = ''; const ans = studentAnswers[activeExamSessionId] || {};
            
            for(let i=0; i<activeQuestions.length; i++) {
                let cl = 'bg-white border text-slate-500 border-slate-200 hover:bg-slate-50';
                let answered = false; const qType = activeQuestions[i].type; const a = ans[i];
                
                if (a !== undefined && a !== null) {
                    if (qType === 'pg') answered = (a !== '');
                    else if (qType === 'pgk') answered = (Array.isArray(a) && a.length > 0);
                    else if (qType === 'bs' || qType === 'jodoh') answered = (typeof a === 'object' && Object.keys(a).length > 0); 
                    else if (qType === 'uraian') answered = (typeof a === 'object' ? a.text.trim() !== '' : a.toString().trim() !== '');
                }
                
                if(answered) cl = 'bg-emerald-500 text-white border-emerald-600 shadow-sm hover:bg-emerald-600';
                if(i === currentQuestionIndex) cl += ' ring-4 ring-indigo-200 font-black border-indigo-600 text-indigo-700 scale-105';
                html += `<button onclick="jumpToQuestion(${i})" class="w-full aspect-square rounded-xl font-bold text-sm transition-all duration-200 ${cl}">${i+1}</button>`;
            }
            grid.innerHTML = html;
        }

        function toggleMobileGrid() { const d = document.getElementById('mobile-grid-drawer'); if(d) d.classList.toggle('translate-x-full'); }

        function renderQuestion() {
            let q = activeQuestions[currentQuestionIndex]; if(!q) return;
            document.getElementById('q-number').innerText = currentQuestionIndex + 1;
            
            const badge = document.getElementById('q-type-badge');
            if(q.type === 'pgk') { badge.innerText = "Pilih Semua Benar (Checkbox)"; badge.className = "text-[10px] font-extrabold px-3 py-1.5 bg-indigo-50 text-indigo-600 rounded-lg uppercase tracking-widest border border-indigo-100"; }
            else if(q.type === 'bs') { badge.innerText = "Tabel Benar / Salah"; badge.className = "text-[10px] font-extrabold px-3 py-1.5 bg-emerald-50 text-emerald-600 rounded-lg uppercase tracking-widest border border-emerald-100"; }
            else if(q.type === 'jodoh') { badge.innerText = "Menjodohkan (Pasangan)"; badge.className = "text-[10px] font-extrabold px-3 py-1.5 bg-amber-50 text-amber-600 rounded-lg uppercase tracking-widest border border-amber-100"; }
            else if(q.type === 'uraian') { badge.innerText = "Soal Uraian / Esai"; badge.className = "text-[10px] font-extrabold px-3 py-1.5 bg-rose-50 text-rose-600 rounded-lg uppercase tracking-widest border border-rose-100"; }
            else { badge.innerText = "Pilih 1 Jawaban (A-E)"; badge.className = "text-[10px] font-extrabold px-3 py-1.5 bg-slate-100 text-slate-500 rounded-lg uppercase tracking-widest border border-slate-200"; }
            
            let html = `
                <div class="mb-5 font-semibold text-lg leading-relaxed text-slate-800">${q.text || ''}</div>
                ${q.image ? `<div class="mb-8"><img src="${q.image}" class="max-w-full rounded-xl border border-slate-200 shadow-sm max-h-[300px] object-contain"></div>` : ''}
            `;
            const ans = studentAnswers[activeExamSessionId] || {};

            if (q.type === 'pg' || q.type === 'pgk') {
                html += `<div class="space-y-4">`;
                (q.options || []).forEach((opt, i) => {
                    if(opt.trim() === '' && !(q.optionsImg && q.optionsImg[i])) return; 
                    let isChecked = false;
                    if(q.type === 'pg') isChecked = (ans[currentQuestionIndex] === opt);
                    else if(q.type === 'pgk') isChecked = ((ans[currentQuestionIndex]||[]).includes(opt));
                    
                    let inputType = (q.type === 'pg') ? 'radio' : 'checkbox';
                    let labelPrefix = q.type==='pg' || q.type==='pgk' ? `<span class="font-black mr-4 text-slate-300 group-hover:text-indigo-300 transition-colors">${String.fromCharCode(65+i)}.</span>` : '';

                    let imgOpt = (q.optionsImg && q.optionsImg[i]) ? `<img src="${q.optionsImg[i]}" class="mt-3 max-w-full rounded-lg border border-slate-200 max-h-32 object-contain">` : '';
                    let encodedOpt = encodeURIComponent(opt).replace(/'/g, "%27");
                    
                    html += `<label class="group flex items-start p-5 border-2 rounded-2xl cursor-pointer transition-all duration-200 shadow-sm ${isChecked ? 'bg-indigo-50/50 border-indigo-500 ring-4 ring-indigo-50' : 'bg-white border-slate-100 hover:border-indigo-300 hover:bg-slate-50 hover:shadow-md'}">
                        <input type="${inputType}" name="q_opt" class="w-5 h-5 mr-4 mt-0.5 accent-indigo-600 cursor-pointer" onchange="saveAnswer(decodeURIComponent('${encodedOpt}'), '${q.type}')" ${isChecked ? 'checked' : ''}>
                        <div class="flex-1 text-base font-medium ${isChecked ? 'text-indigo-900' : 'text-slate-700'}">${labelPrefix} ${opt} ${imgOpt}</div>
                    </label>`;
                });
                html += `</div>`;
            } 
            else if (q.type === 'bs') {
                html += `
                <div class="overflow-x-auto bg-white border border-slate-200 rounded-2xl shadow-sm">
                    <table class="w-full text-left text-sm md:text-base border-collapse">
                        <thead>
                            <tr class="bg-slate-100 border-b border-slate-200 text-slate-600 font-extrabold text-xs md:text-sm">
                                <th class="p-4 w-12 text-center">No</th>
                                <th class="p-4 border-l border-slate-200">Pernyataan</th>
                                <th class="p-4 w-28 text-center border-l border-slate-200 bg-emerald-50 text-emerald-700">Benar</th>
                                <th class="p-4 w-28 text-center border-l border-slate-200 bg-rose-50 text-rose-700">Salah</th>
                            </tr>
                        </thead>
                        <tbody>`;
                
                let currentAns = ans[currentQuestionIndex] || {};
                let prompts = (q.prompts && q.prompts.length > 0) ? q.prompts : [q.text.replace(/<[^>]*>?/gm, '')]; 

                prompts.forEach((prmpt, i) => {
                    let ansBenar = currentAns[i] === 'Benar' ? 'checked' : '';
                    let ansSalah = currentAns[i] === 'Salah' ? 'checked' : '';
                    
                    html += `
                            <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                <td class="p-4 text-center font-black text-slate-400 bg-slate-50/50">${i+1}</td>
                                <td class="p-4 border-l border-slate-100 font-medium text-slate-800 leading-relaxed">${prmpt}</td>
                                <td class="p-4 text-center border-l border-slate-100 bg-emerald-50/20 hover:bg-emerald-50 transition-colors cursor-pointer" onclick="document.getElementById('bs_${i}_benar').click()">
                                    <input type="radio" id="bs_${i}_benar" name="bs_ans_${i}" class="w-6 h-6 accent-emerald-500 cursor-pointer" onchange="saveAnswer('Benar', 'bs', ${i})" ${ansBenar}>
                                </td>
                                <td class="p-4 text-center border-l border-slate-100 bg-rose-50/20 hover:bg-rose-50 transition-colors cursor-pointer" onclick="document.getElementById('bs_${i}_salah').click()">
                                    <input type="radio" id="bs_${i}_salah" name="bs_ans_${i}" class="w-6 h-6 accent-rose-500 cursor-pointer" onchange="saveAnswer('Salah', 'bs', ${i})" ${ansSalah}>
                                </td>
                            </tr>
                    `;
                });
                html += `</tbody></table></div>`;
            }
            else if (q.type === 'jodoh') {
                html += `<div class="bg-slate-50 p-6 border border-slate-200 rounded-3xl space-y-4 shadow-inner">`;
                let currentAns = ans[currentQuestionIndex] || {};
                let selectedValues = Object.values(currentAns).filter(v => v !== "");
                
                (q.prompts || []).forEach((prmpt, i) => {
                    html += `<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 p-5 bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow transition-shadow">
                        <div class="font-bold text-slate-700 flex-1 flex gap-3 leading-relaxed"><span class="bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-lg text-slate-500 text-sm h-fit font-black shadow-sm">${i+1}</span> <span>${prmpt}</span></div>
                        <i class="fas fa-arrow-right text-slate-300 hidden md:block"></i>
                        <select onchange="saveAnswer(this.value === '' ? '' : decodeURIComponent(this.value), 'jodoh', ${i})" class="flex-1 px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 font-semibold text-sm text-slate-700 cursor-pointer transition-all">
                            <option value="">-- Pilih Pasangan Jawaban --</option>
                            ${(q.options || []).map(o => {
                                let isSelectedHere = currentAns[i] === o;
                                let isSelectedElsewhere = !isSelectedHere && selectedValues.includes(o);
                                let disabledAttr = isSelectedElsewhere ? 'disabled' : '';
                                let classStr = isSelectedElsewhere ? 'class="text-slate-400 bg-slate-200"' : '';
                                let textAdd = isSelectedElsewhere ? ' (Sudah Dipilih)' : '';
                                
                                let encodedVal = encodeURIComponent(o);
                                let cleanDisplay = o.replace(/<[^>]*>?/gm, '');
                                if(cleanDisplay.trim() === '') cleanDisplay = '[Gambar / Media]';
                                
                                return `<option value="${encodedVal}" ${isSelectedHere ? 'selected' : ''} ${disabledAttr} ${classStr}>${cleanDisplay}${textAdd}</option>`;
                            }).join('')}
                        </select>
                    </div>`;
                });
                html += `</div>`;
            }
            else if (q.type === 'uraian') {
                let currentText = typeof ans[currentQuestionIndex] === 'object' ? ans[currentQuestionIndex].text : (ans[currentQuestionIndex] || '');
                html += `
                <div class="space-y-4">
                    <label class="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wider">Lembar Jawaban Uraian</label>
                    <textarea oninput="saveAnswer(this.value, 'uraian')" class="w-full px-5 py-4 border-2 border-slate-200 bg-slate-50 rounded-2xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 outline-none text-sm shadow-sm transition-all font-medium leading-relaxed" rows="8" placeholder="Ketik jawaban Anda di sini secara lengkap dan jelas...">${currentText}</textarea>
                    <div class="text-right text-[10px] text-emerald-600 font-bold mt-2"><i class="fas fa-save mr-1"></i> Tersimpan otomatis saat mengetik</div>
                </div>`;
            }

            document.getElementById('question-content-area').innerHTML = html;
            document.getElementById('btn-prev').disabled = currentQuestionIndex === 0;
            
            if (currentQuestionIndex === activeQuestions.length - 1) { 
                document.getElementById('btn-next').classList.add('hidden'); 
                document.getElementById('btn-finish').classList.remove('hidden'); 
            } else { 
                document.getElementById('btn-next').classList.remove('hidden'); 
                document.getElementById('btn-finish').classList.add('hidden'); 
            }
        }

        function saveAnswer(val, type, promptIdx = null) {
            if(!studentAnswers[activeExamSessionId]) studentAnswers[activeExamSessionId] = {};
            if (type === 'pg') { studentAnswers[activeExamSessionId][currentQuestionIndex] = val; }
            else if (type === 'pgk') {
                let arr = studentAnswers[activeExamSessionId][currentQuestionIndex] || [];
                if(arr.includes(val)) arr = arr.filter(v => v !== val); else arr.push(val);
                studentAnswers[activeExamSessionId][currentQuestionIndex] = arr;
            } else if (type === 'bs' || type === 'jodoh') {
                let obj = studentAnswers[activeExamSessionId][currentQuestionIndex] || {};
                obj[promptIdx] = val; studentAnswers[activeExamSessionId][currentQuestionIndex] = obj;
            } else if (type === 'uraian') {
                let obj = studentAnswers[activeExamSessionId][currentQuestionIndex] || { text: '', score: 0 };
                if(typeof obj !== 'object') obj = { text: obj, score: 0 }; 
                obj.text = val;
                studentAnswers[activeExamSessionId][currentQuestionIndex] = obj;
            }
            saveExamStateLocal(); renderQuestionGrid();
            
            if(type === 'jodoh') renderQuestion(); 
        }

        function prevQuestion() { if(currentQuestionIndex > 0) { currentQuestionIndex--; saveExamStateLocal(); renderQuestion(); renderQuestionGrid(); } }
        function nextQuestion() { if(currentQuestionIndex < activeQuestions.length - 1) { currentQuestionIndex++; saveExamStateLocal(); renderQuestion(); renderQuestionGrid(); } }
        function jumpToQuestion(i) { currentQuestionIndex = i; saveExamStateLocal(); renderQuestion(); renderQuestionGrid(); if(window.innerWidth < 1024) toggleMobileGrid(); }

        function disableCopyKeys(e) { if(currentView === 'exam-active' && (e.ctrlKey || e.metaKey) && ['c','v','x','p'].includes(e.key.toLowerCase())) { e.preventDefault(); return false; } }
        function requestFullscreen() { let e = document.documentElement; if (e.requestFullscreen) e.requestFullscreen(); else if (e.webkitRequestFullscreen) e.webkitRequestFullscreen(); }
        function exitFullscreen() { if (document.fullscreenElement || document.webkitFullscreenElement) { if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } }
        
        function handleVisibilityChange() { if(isUnloading) return; if(!isExamLocked && document.visibilityState === 'hidden') triggerCheatWarning(); }
        function handleBlur() { if(isUnloading) return; if(!isExamLocked) triggerCheatWarning(); }

        function triggerCheatWarning() {
            const now = Date.now(); if (now - lastCheatTime < 2000) return; 
            lastCheatTime = now; cheatWarnings++;

            if (cheatWarnings === 1) {
                document.getElementById('cheat-warning-screen').classList.remove('hidden');
                saveExamStateLocal();
                callServer('apiUpdateSession', { examId: activeExamSessionId, username: currentUser.username, status: 'STARTED', cheatCount: cheatWarnings }).catch(()=>{});
            } 
            else if (cheatWarnings === 2) {
                isExamLocked = true; 
                saveExamStateLocal();
                document.getElementById('exam-locked-screen').classList.remove('hidden'); 
                callServer('apiUpdateSession', { examId: activeExamSessionId, username: currentUser.username, status: 'LOCKED', cheatCount: cheatWarnings }).catch(()=>{});
            } 
            else if (cheatWarnings >= 3) {
                isExamLocked = true;
                saveExamStateLocal();
                document.getElementById('exam-locked-screen').classList.add('hidden');
                let warningScreen = document.getElementById('cheat-warning-screen');
                if(warningScreen) warningScreen.classList.add('hidden');
                
                finishExamAuto('PELANGGARAN MAKSIMAL! Anda terdeteksi keluar dari layar ujian sebanyak 3 kali. Ujian dihentikan paksa oleh sistem.');
            }
        }
        
        function confirmFinishExam() { 
            const ans = studentAnswers[activeExamSessionId] || {};
            let answeredCount = 0;

            activeQuestions.forEach((q, i) => {
                let a = ans[i];
                let isAns = false;
                if (a !== undefined && a !== null) {
                    if (q.type === 'pg') isAns = (a !== '');
                    else if (q.type === 'pgk') isAns = (Array.isArray(a) && a.length > 0);
                    else if (q.type === 'bs' || q.type === 'jodoh') isAns = (typeof a === 'object' && Object.keys(a).length > 0); 
                    else if (q.type === 'uraian') isAns = (typeof a === 'object' ? a.text.trim() !== '' : String(a).trim() !== '');
                }
                if (isAns) answeredCount++;
            });

            const unans = activeQuestions.length - answeredCount;
            let msg = 'Yakin telah memeriksa semua jawaban dengan baik dan siap menyelesaikan ujian secara permanen?';

            if (unans > 0) {
                msg = `<span class="text-rose-500 font-bold block mb-2"><i class="fas fa-exclamation-triangle"></i> Peringatan: Masih ada ${unans} soal yang belum dijawab!</span>` + msg;
            }

            showCustomConfirm('Konfirmasi Selesai?', msg, 'Selesai & Kirim', 'primary', () => finishExamAuto()); 
        }

        async function finishExamAuto(msg = null) {
            clearInterval(examInterval); 
            document.removeEventListener('visibilitychange', handleVisibilityChange); 
            window.removeEventListener('blur', handleBlur); 
            document.removeEventListener('keydown', disableCopyKeys);

            const loader = document.getElementById('loading-overlay');
            const loaderText = document.getElementById('loading-text');
            if(loader) {
                if(loaderText) loaderText.innerText = "Menyimpan Jawaban ke Server...";
                loader.classList.remove('hidden');
            }

            try {
                const res = await callServer('apiSubmitExam', { 
                    examId: activeExamSessionId, 
                    username: currentUser.username, 
                    answersJSON: JSON.stringify(studentAnswers[activeExamSessionId] || {}) 
                });

                if(res === true || res.success) {
                    exitFullscreen();
                    localStorage.removeItem('cbt_exam_state_' + activeExamSessionId); 
                    activeExamSessionId = null;
                    
                    if(loader) loader.classList.add('hidden');
                    showCustomAlert('Berhasil', msg || 'Ujian Selesai! Seluruh jawaban Anda telah tersimpan dengan aman di server.', 'success');
                    setTimeout(() => navigateTo('user-dashboard'), 2500);
                } else {
                    throw new Error("Gagal menyimpan dari server");
                }
            } catch(err) {
                if(loader) loader.classList.add('hidden');
                
                if(!msg) {
                    startTimer(); 
                    document.addEventListener('visibilitychange', handleVisibilityChange); 
                    window.addEventListener('blur', handleBlur); 
                    document.addEventListener('keydown', disableCopyKeys);
                    showCustomAlert('Gagal Mengirim', 'Server sibuk atau koneksi terputus. Jawaban Anda masih aman di perangkat. Silakan klik tombol Akhiri Ujian kembali.', 'error');
                } else {
                    showCustomAlert('Peringatan Jaringan', 'Gagal memproses ke server. Pastikan internet aktif, lalu Segarkan (F5) halaman ini untuk mencoba mengirim ulang.', 'error');
                }
            }
        }

        async function unlockExamServer() {
            const token = document.getElementById('unlock-token').value.trim().toUpperCase();
            if(!token) return showCustomAlert('Peringatan', 'Masukkan token pembuka kunci.', 'error');

            try {
                const res = await callServer('apiVerifyAndUseToken', {token, type: 'UNLOCK', examId: activeExamSessionId, username: currentUser.username});
                if(res.success) {
                    isExamLocked = false;
                    hasUsedUnlockToken = true;
                    saveExamStateLocal(); 
                    
                    document.getElementById('exam-locked-screen').classList.add('hidden');
                    document.getElementById('unlock-token').value = '';
                    
                    requestFullscreen();
                    showCustomAlert('Berhasil', 'Ujian berhasil dibuka kembali. PENTING: Jangan mengulangi pelanggaran.', 'success');
                } else {
                    showCustomAlert('Gagal', res.message, 'error');
                }
            } catch(e) {}
        }

        window.onload = async () => { 
            const savedSession = localStorage.getItem('cbt_user');
            const savedRoute = localStorage.getItem('cbt_route'); 
            
            if (savedSession) {
                try {
                    currentUser = JSON.parse(savedSession);
                    if(currentUser.role === 'admin' || currentUser.role === 'superadmin') {
                        classOptions = await callServer('apiGetClasses', {}).catch(() => []);
                    }

                    if(savedRoute) {
                        const route = JSON.parse(savedRoute);
                        if(route.dataId) { activeExamSessionId = route.dataId; manageExamId = route.dataId; }
                        await navigateTo(route.view, route.dataId || null);
                    } else {
                        await navigateTo((currentUser.role === 'admin' || currentUser.role === 'superadmin') ? 'admin-dashboard' : 'user-dashboard');
                    }
                } catch(e) {
                    console.error('Gagal memuat sesi tersimpan:', e);
                    localStorage.removeItem('cbt_route');
                    currentView = currentUser && (currentUser.role === 'admin' || currentUser.role === 'superadmin') ? 'admin-dashboard' : 'user-dashboard';
                    renderApp();
                }
            } else { 
                renderApp(); 
            }
        };
    </script>
</body>
</html>
